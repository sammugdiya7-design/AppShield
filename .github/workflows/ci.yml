name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test and Quality Gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Ruff linting
        run: ruff check appshield tests

      - name: Ruff formatting check
        run: ruff format --check appshield tests

      - name: Mypy type checking
        run: mypy appshield tests

      - name: Bandit security scan
        run: bandit -c pyproject.toml -r appshield

      - name: Run pytest with coverage
        run: pytest --cov=appshield --cov-report=term-missing

      - name: Verify package build
        run: python -m build
