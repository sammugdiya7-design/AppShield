[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "appshield"
version = "0.1.0"
description = "A simple, local, cross-platform application code-protection CLI"
readme = "README.md"
authors = [
    { name = "Sam Jain", email = "244658121+sammugdiya7-design@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff==0.17.4",
    "bandit>=1.7",
    "build>=1.0",
]

[project.scripts]
appshield = "appshield.cli:main"

[tool.setuptools.packages.find]
include = ["appshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
skips = ["B404", "B603"]

[tool.ruff]
extend-exclude = [".planning"]
